[SERVICE]
    Flush          1
    Log_Level      info
    Parsers_File   parsers.conf

[INPUT]
    Name           tail
    Path           examples/gpu-events.log
    Tag            gpu.kernel
    Read_from_Head On
    Exit_On_Eof    On
    Parser         gpu_signal

[OUTPUT]
    Name           stdout
    Match          gpu.*
    Format         json_lines

[OUTPUT]
    Name           opentelemetry
    Match          gpu.*
    Host           127.0.0.1
    Port           4318
    Logs_URI       /v1/logs
    TLS            Off

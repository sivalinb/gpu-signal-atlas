receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "input.value")
          - delete_key(attributes, "output.value")
  batch: {}

exporters:
  debug:
    verbosity: detailed
  otlphttp/langsmith:
    endpoint: ${env:LANGSMITH_ENDPOINT:-https://api.smith.langchain.com/otel}
    headers:
      x-api-key: ${env:LANGSMITH_API_KEY}
      Langsmith-Project: ${env:LANGSMITH_PROJECT:-gpu-signal-atlas}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/redact, batch]
      exporters: [debug, otlphttp/langsmith]

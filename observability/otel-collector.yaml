receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  resource:
    attributes:
      - key: service.name
        value: gpu-signal-replay
        action: upsert
      - key: service.namespace
        value: gpu-observability
        action: upsert
  batch: {}

exporters:
  debug:
    verbosity: detailed
  otlphttp/gateway:
    logs_endpoint: http://127.0.0.1:3000/api/telemetry/v1/logs
    encoding: json
    headers:
      x-telemetry-token: ${env:TELEMETRY_INGEST_TOKEN}
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, otlphttp/gateway]

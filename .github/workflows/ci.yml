name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run index:check
      - run: npm run freshness
      - run: npm test
      - run: npm run evaluate
      - run: npm run ablate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
